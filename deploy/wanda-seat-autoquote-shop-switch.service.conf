[Service]
# This drop-in must sort after older release overrides so both the working
# directory and the actual Node entrypoint point at the same release.
WorkingDirectory=/opt/wanda-preview-plugin/releases/wanda-plugin-0.4.18-shop-switch-20260817
ExecStart=
ExecStart=/usr/bin/node /opt/wanda-preview-plugin/releases/wanda-plugin-0.4.18-shop-switch-20260817/index.mjs
Environment=AI_REPLY_PREVIEW_ENABLED=true
Environment=AI_REPLY_AUTO_SEND_ENABLED=true
