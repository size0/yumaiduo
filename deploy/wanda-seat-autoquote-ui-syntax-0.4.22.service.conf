[Service]
# This filename sorts after every previous release selector.
WorkingDirectory=/opt/wanda-preview-plugin/releases/wanda-plugin-0.4.22-ui-syntax-20260817
ExecStart=
ExecStart=/usr/bin/node /opt/wanda-preview-plugin/releases/wanda-plugin-0.4.22-ui-syntax-20260817/index.mjs
# This is the V3 preview-only plugin. It must not call the retired task bridge
# that lived on the legacy ticket backend at :8000.
Environment=QUOTE_PREVIEW_ONLY=true
Environment=BACKEND_BASE_URL=http://127.0.0.1:8011
Environment=WANDA_V3_PREVIEW_INGEST_URL=http://127.0.0.1:8011/api/quotes/preview-ingest
Environment=AI_REPLY_PREVIEW_ENABLED=true
Environment=AI_REPLY_AUTO_SEND_ENABLED=true
