<div class="app-main"><main>

  <div class="ui-page-header">

      <h1 class="ui-page-header__title">组件预览</h1>

        原子组件层（规范 §3 的 7 个）。<b>这一页里没有一个具体色值</b> ——
        全部走 L3 语义令牌，所以换主题不用改组件。
      </p>
    </div>
    <div class="ui-page-header__actions">

<script src="ui.js"></script>
<script src="theme.js"></script>
<script>
/* 预览页：把每个组件的每个变体排一遍。
   ★ 规范 §8 第②步的验收就是"预览页里把每个变体排一遍，不出现色值"。
   ★ 这一整段里也没有色值 —— 只用 UI.* 工厂和语义类名。 */
(function () {
  const { el, Card, Button, Input, Tag, PageHeader, Empty } = UI;

  function section(title, note, kids) {
    const card = Card({ padding: 'lg', className: 'ui-preview-card' });
    card.appendChild(el('div', { class: 'ui-card__head' }, [
      el('span', { text: title }),
      note ? el('span', {
        class: 'ui-page-header__sub',
        style: { marginLeft: 'var(--sp-2)', fontSize: 'var(--fs-2xs)' },
        text: note,
      }) : null,
    ]));
    const body = el('div', {
      class: 'ui-card__body',
      style: { display: 'flex', flexWrap: 'wrap', gap: 'var(--sp-3)',
               alignItems: 'center' },
    }, kids);
    card.appendChild(body);
    return card;
  }

  const box = document.getElementById('preview');
  box.style.display = 'flex';
  box.style.flexDirection = 'column';
  box.style.gap = 'var(--sp-4)';

  // ---- Button：variant × size ----
  const VARIANTS = ['primary', 'secondary', 'outline', 'ghost', 'danger', 'link'];
  const SIZES = ['xs', 'sm', 'md', 'lg'];
  VARIANTS.forEach(v => {
    box.appendChild(section('Button · ' + v,
      'variant=' + v + '，四种 size', SIZES.map(s =>
        Button({ variant: v, size: s, text: '按钮 ' + s }))));
  });
  box.appendChild(section('Button · loading / disabled',
    'loading 用 CSS 转圈（不引图片）', [
      Button({ variant: 'primary', loading: true, text: '提交中' }),
      Button({ variant: 'secondary', disabled: true, text: '已禁用' }),
      Button({ variant: 'primary', leftIcon: el('span', { text: '＋' }),
               text: '带左图标' }),
    ]));

  // ---- Card ----
  box.appendChild(section('Card · padding',
    'sm / md / lg 三档内边距', ['sm', 'md', 'lg'].map(p =>
      Card({ padding: p, title: 'padding=' + p, body: '内容区域' }))));

  // ---- Input ----
  box.appendChild(section('Input',
    '默认 / 带说明 / error 态 / disabled', [
      Input({ placeholder: '普通输入框' }),
      Input({ placeholder: '带说明', value: '' }),
      Input({ placeholder: '出错了', error: '这个字段必填' }),
      Input({ placeholder: '不可编辑', disabled: true }),
    ]));

  // ---- Tag ----
  box.appendChild(section('Tag · variant',
    '底色用 color-mix 从基色令牌算，不另写 rgba', [
      Tag({ text: '默认' }),
      Tag({ variant: 'brand', text: '品牌' }),
      Tag({ variant: 'success', text: '成功', dot: true }),
      Tag({ variant: 'warning', text: '警告', dot: true }),
      Tag({ variant: 'danger', text: '危险', dot: true }),
      Tag({ variant: 'info', text: '信息', dot: true }),
      Tag({ variant: 'brand', size: 'sm', text: '小号' }),
    ]));

  // ---- PageHeader ----
  box.appendChild(section('PageHeader', '每页统一头部（标题 + 副标题 + 右侧动作）', [
    el('div', { style: { width: '100%' } }, [
      PageHeader({
        title: '页面标题',
        subtitle: '这是副标题，说明这一页在干什么',
        actions: Button({ variant: 'primary', size: 'sm', text: '主要动作' }),
      }),
    ]),
  ]));

  // ---- Empty ----
  box.appendChild(section('Empty', '空态统一（图标 + 标题 + 说明 + 动作）', [
    el('div', { style: { width: '100%' } }, [
      Empty({
        icon: el('span', { text: '☐', style: { fontSize: 'var(--fs-2xl)' } }),
        title: '还没有数据',
        description: '走过一次流程之后，这里就会出现记录。',
        action: Button({ variant: 'secondary', size: 'sm', text: '去做点什么' }),
      }),
    ]),
  ]));

  // ---- cn() ----
  box.appendChild(section('cn() · 类名合并', '去重 + 过滤假值 + 后者覆盖', [
    el('code', { class: 'ui-input', style: { width: '100%' },
                 text: "cn('ui-btn', size && 'ui-btn--' + size, { 'ui-btn--loading': true }, 'ui-btn')" }),
    el('code', { class: 'ui-input', style: { width: '100%' },
                 text: '=> ' + UI.cn('ui-btn', 'ui-btn--sm',
                                     { 'ui-btn--loading': true }, 'ui-btn') }),
  ]));

  // ---- 主题下拉（用色盘那套主题名）----
  const sel = document.getElementById('theme-select');
  const THEMES = [['mist', '雾蓝'], ['sky', '天青'], ['mint', '薄荷'],
                  ['rose', '藕荷'], ['paper', '暖纸'], ['ink', '墨灰'],
                  ['plain', '无光斑']];
  sel.innerHTML = THEMES.map(([k, n]) =>
    '<option value="' + k + '">' + n + '</option>').join('');
  sel.value = document.documentElement.getAttribute('data-theme') || 'mist';
  sel.onchange = () => {
    document.documentElement.setAttribute('data-theme', sel.value);
    try { localStorage.setItem('ticket-theme', sel.value); } catch (e) {}
  };
})();
</script>
</body>
