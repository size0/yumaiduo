# V2 formal-cutover template. This file is intentionally suffixed .disabled
# and is not loaded by nginx. Do not copy it into /etc/nginx/sites-enabled/
# until the cutover checklist has been approved and the old system rollback
# path has been verified.
#
# Required environment changes before enabling:
#   HOST=127.0.0.1
#   PORT=8100
#   PLUGIN_HOST=127.0.0.1
#   COOKIE_SECURE=true
# Keep ENABLE_LIVE_WRITES=false during the domain switch. Enabling business
# writes is a separate, explicitly approved production exercise.

server {
    listen 80;
    listen [::]:80;
    server_name wd.xdw0.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
    }

    location = /ui {
        proxy_pass http://127.0.0.1:4003;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ^~ /ui/ {
        proxy_pass http://127.0.0.1:4003;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name wd.xdw0.cn;

    ssl_certificate /etc/letsencrypt/live/wd.xdw0.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wd.xdw0.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    access_log /var/log/nginx/wd.xdw0.cn.v2.access.log;
    error_log /var/log/nginx/wd.xdw0.cn.v2.error.log warn;

    client_max_body_size 50m;

    location = /ui {
        proxy_pass http://127.0.0.1:4003;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ^~ /ui/ {
        proxy_pass http://127.0.0.1:4003;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # V4 buyer-message ingress only; keep order callbacks on their existing routes.
    location = /__plugin__/webhook/im.message.received {
        proxy_pass http://127.0.0.1:4003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
    location ^~ /api/v1/plugin/ { proxy_pass http://127.0.0.1:4003; }
    # The V2 backend must be loopback-only before this server block is enabled.
    root /opt/ticket-system/current/frontend/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
